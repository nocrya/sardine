# 本地开发用 PostgreSQL。DSN 与 backend/.env.example 一致。
# 启动: docker compose up -d postgres
# 停止: docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: sardine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sardine
    ports:
      - "5432:5432"
    volumes:
      - sardine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sardine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sardine_pgdata:
