# 本地开发：PostgreSQL + LiveKit（与 backend/.env.example 中 LiveKit 默认值一致）。
# 启动全部: docker compose up -d
# 仅数据库: docker compose up -d postgres
# 停止: docker compose down
#
# LiveKit：使用 docker/livekit.yaml（devkey/secret）并把 RTC UDP 限制在 50100–50200，
# 与下方 ports 一致；否则默认会占用 50000–60000，容器未映射时 WebRTC 会超时。
# 信令 ws://localhost:7880；Android 模拟器请改用 ws://10.0.2.2:7880。
services:
  postgres:
    image: postgres:16-alpine
    container_name: sardine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sardine
    ports:
      - "5432:5432"
    volumes:
      - sardine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sardine"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: sardine-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"

volumes:
  sardine_pgdata:
